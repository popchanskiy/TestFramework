name: pr-regression

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ENV_FILE: .env.docker
      IMAGE_NAME: local/testframework-runner:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test runner image
        run: docker build -t "${IMAGE_NAME}" .

      - name: Run Checkstyle
        run: docker run --rm "${IMAGE_NAME}" mvn -B checkstyle:check

      - name: Start infrastructure
        run: sh run-infra.sh up

      - name: Run REGRESSION suite
        env:
          TEST_GROUPS: REGRESSION
        run: sh run-tests-in-docker.sh

      - name: Upload PR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-regression-artifacts
          path: |
            target/surefire-reports/**
            target/reports/**
          if-no-files-found: warn

      - name: Print infrastructure logs on failure
        if: failure()
        run: docker compose --env-file "${ENV_FILE}" logs --no-color

      - name: Stop infrastructure
        if: always()
        run: sh run-infra.sh down
