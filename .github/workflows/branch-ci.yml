name: branch-ci

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch_ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENV_FILE: .env.docker
      IMAGE_NAME: local/testframework-runner:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test runner image
        run: docker build -t "${IMAGE_NAME}" .

      - name: Run Checkstyle
        run: docker run --rm "${IMAGE_NAME}" mvn -B checkstyle:check

      - name: Start infrastructure
        run: sh run-infra.sh up

      - name: Run INTEGRATION suite
        env:
          TEST_GROUPS: INTEGRATION
        run: |
          sh run-tests-in-docker.sh
          mkdir -p ci-artifacts/integration
          cp -R target/surefire-reports ci-artifacts/integration/ || true
          cp -R target/reports ci-artifacts/integration/ || true

      - name: Run API suite
        env:
          TEST_GROUPS: API
        run: |
          sh run-tests-in-docker.sh
          mkdir -p ci-artifacts/api
          cp -R target/surefire-reports ci-artifacts/api/ || true
          cp -R target/reports ci-artifacts/api/ || true

      - name: Run DB suite
        env:
          TEST_GROUPS: DB
        run: |
          sh run-tests-in-docker.sh
          mkdir -p ci-artifacts/db
          cp -R target/surefire-reports ci-artifacts/db/ || true
          cp -R target/reports ci-artifacts/db/ || true

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-ci-artifacts
          path: ci-artifacts/**
          if-no-files-found: warn

      - name: Print infrastructure logs on failure
        if: failure()
        run: docker compose --env-file "${ENV_FILE}" logs --no-color

      - name: Stop infrastructure
        if: always()
        run: sh run-infra.sh down
